version: 2
updates:
  - package-ecosystem: pip
    directory: /analysis
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, python]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, web]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
