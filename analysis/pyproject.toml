[project]
name = "lockedgroove"
version = "0.1.0"
description = "CrateAI compute: audio analysis, loops, stems, chops, combine, re-voice, breakdown."
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "librosa>=0.10.2",
  "soundfile>=0.12",
  "pyloudnorm>=0.1.1",
  "pydantic>=2.6",
  "pretty_midi>=0.2.10",
  "mido>=1.3",
  "scikit-learn>=1.4",
  "joblib>=1.3",
]

[project.optional-dependencies]
compute = [
  "modal>=1.0",
  "supabase>=2.4",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-dotenv>=1.0",
]
gpu = [
  "torch>=2.2",
  "audio-separator[gpu]>=0.28",
  "basic-pitch>=0.4",
  "laion-clap>=1.1",
]
stretch = [
  "pyrubberband>=0.4",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "jsonschema>=4.21",
  "httpx>=0.27",
  "fastapi>=0.110",
  "python-dotenv>=1.0",
]

[project.scripts]
lockedgroove-server = "lockedgroove.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lockedgroove"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
  "ignore::UserWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "UP045", "UP037", "UP007", "B008", "B905"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
